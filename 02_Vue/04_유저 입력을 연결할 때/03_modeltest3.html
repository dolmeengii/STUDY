<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 4-3</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>체크박스의 ON/OFF 확인하는 예제</h2>
        <div id="app">
            <label><input type="checkbox" v-model="myCheck">
                체크박스의 상태는 {{myCheck}}
            </label>
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    myCheck: false
                }
            })
        </script>
        
    </body>
</html>
