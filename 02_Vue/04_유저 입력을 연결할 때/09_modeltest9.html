<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 4-9</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>복수의 선택을 배열로 처리</h2>
        <div id="app">
            <select v-model="myColor" multiple style="width:150px">
                <option>red</option>
                <option>green</option>
                <option>blue</option>
                <option>orange</option>
                <option>brown</option>
            </select>
            <p>선택한 색상은 {{ myColor }} 입니다.</p>
        </div>    
        <script>
            new Vue({
                el: '#app',
                data: {
                    myColor: []
                }
            })
        </script>
        
    </body>
</html>
