<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 4-12</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <!--문자열로 처리 되어 100 뒤에 숫자가 써짐-->
        <h2>입력 후 자동으로 수식으로 변경하지 않는 예제</h2>
        <div id="app">
            <input v-model="myNumber" type="number">
            <p> 100을 더해서 표시 {{ 100 + myNumber }}</p>
        </div>    
        <script>
            new Vue({
                el: '#app',
                data: {
                    myNumber: 0
                }
            })
        </script>
        
    </body>
</html>
