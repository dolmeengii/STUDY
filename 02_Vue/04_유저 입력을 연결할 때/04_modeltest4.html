<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 4-4</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>복수의 체크박스의 ON을 배열로 만드는 예제</h2>
        <div id="app">
            <label><input type="checkbox" value="red" v-model="myChecks">적</label> <br>
            <label><input type="checkbox" value="green" v-model="myChecks">녹</label> <br>
            <label><input type="checkbox" value="blue" v-model="myChecks">청</label> <br>
            선택한 색은 {{myChecks}}
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    myChecks: []
                }
            })
        </script>
        
    </body>
</html>
