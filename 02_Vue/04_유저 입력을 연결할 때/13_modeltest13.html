<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 4-13</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>앞뒤의 공백을 자동으로 제거하는 예제</h2>
        <div id="app">
            <!-- .trim 을 사용하지 않으면 공백을 제거하지 않음 -->
            <input v-model.trim="myText">
            <p> 앞뒤 공백을 제거 {{ myText }}</p>
        </div>    
        <script>
            new Vue({
                el: '#app',
                data: {
                    myText: ''
                }
            })
        </script>
        
    </body>
</html>
