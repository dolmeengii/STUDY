<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 4-2</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>입력한 문장과 문자수를 표시하는 예제</h2>
        <div id="app">
            <textarea v-model="myText"></textarea>
            <p>문장은, {{ myText }}</p>
            <p>문자수는 {{myText.length}} 자 입니다.</p>
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    myText: '오늘 날씨 좋습니다.'
                }
            })
        </script>
        
    </body>
</html>
