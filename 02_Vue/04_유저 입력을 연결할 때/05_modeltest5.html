<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 4-5</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>동의에 체크하면 송신 버튼이 활성화되는 예제</h2>
        <div id="app">
            <label><input type="checkbox" v-model="myAgree">동의합니다.</label>
            <button v-bind:disable="myAgree==false">송신</button>
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    myAgree: false
                }
            })
        </script>
        
    </body>
</html>
