<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 2-3</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>데이터로 v-html을 표시하는 예제</h2>
        <div id = "app">
            <p v-text="myText"></p>
            <p v-html="myText"></p> <!-- html 효과를 그대로 보여줄 수 있음, 문자열 크기 등등-->
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    myText: '<h1>Hello!!!</h1>'
                }
            })
        </script>
    </body>
</html>
