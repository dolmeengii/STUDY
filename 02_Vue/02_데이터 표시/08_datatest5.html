<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 2-8</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>JavaScript로 만든 데이터를 표시하는 예제</h2>
        <div id = "app">
            <p>{{myTea}} </p>
            <p>{{myTea[1].name}}: {{myTea[1].price}}원</p>
        </div>
        <script>
            var teaList = [
                {name: '다즐링', price: 600},
                {name: '얼그레이', price: 500},
                {name: '실론', price: 500}
            ]

            new Vue({
                el: '#app',
                data: {
                    myTea: teaList
                }
            })
        </script>
    </body>
</html>
