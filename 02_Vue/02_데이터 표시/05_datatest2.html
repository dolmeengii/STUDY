<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 2-5</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>JavaScript를 이용하여 표시하는 예제</h2>
        <div id = "app">
            <p>{{myPrice * 1.08}} </p>
            <p>{{"안녕하세요~" + myName + "님"}} </p>
            <p>{{myName.substr(0,1)}} </p>
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    myPrice: 500,
                    myName: '홍길동'
                }
            })
        </script>
    </body>
</html>
