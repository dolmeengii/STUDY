<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 3-2</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>링크를 지정하는 예제</h2>
        <div id="app">
            <a href="https://roadbook.co.kr/">링크를 직접 지정</a><p>
                
            </p>
            <a v-bind:href="myURL">링크를 v-bind로 지정</a>
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    myURL:'https://roadbook.co.kr/'
                }
            })
        </script>
        
    </body>
</html>
