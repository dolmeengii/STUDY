<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Vue.js 예제 3-1</title>
        <link rel="stylesheet" href="style.css">
        <script src="http://cdn.jsdelivr.net/npm/vue@2.6.10/dist/vue.js"></script>
    </head>
    <body>
        <h2>이미지를 지정하는 예제</h2>
        <div id="app">
            <img src="face1.png"/> <!-- 직접 지정 -->
            <img v-bind:src="fileName"/> <!-- v-bind로 지정 -->
        </div>
        <script>
            new Vue({
                el: '#app',
                data: {
                    fileName:'face1.png'
                }
            })
        </script>
        
    </body>
</html>
